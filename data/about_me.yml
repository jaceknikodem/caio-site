intro:
  title: "About me"
  text: "I work as a **Fractional Chief AI Officer (CAIO)** — helping PE-backed SaaS and fintech companies that are investing in AI but not shipping products that move revenue.\n\nBefore this, I spent 12 years building and shipping AI at DeepMind and in production systems reaching over a billion users — recommender systems, RL agents, on-device GenAI features, safety systems. Over 20 launches. $300M+ in revenue impact. The first team to deploy DeepMind research into consumer products at that scale.\n\nI built and led ML teams across the US and Asia, ran an **AI incubator** (10 sprints per quarter, idea to prototype), and built **the largest ML community in APAC** — 500+ engineers across products and countries.\n\nThat track record is the foundation of the consulting practice. I know what breaks in production, what directions waste engineering spend, and what it takes to build a team that can run AI without a consultant in the room.\n\nBefore AI, I worked in fintech — credit derivatives at Bank of America Merrill Lynch."

items:
  - title: "Google Pixel"
    date: "2023"
    category: "Mobile AI"
    description: "Recorder Summarization - the first foundational language models on mobile devices (<a href='https://blog.google/technology/ai/google-gemini-ai/' target='_blank'>press</a>), awarded one of the 10 tech innovation at Google in 2023.\nLLM-based weather summarization and diffusion-based weather background generation.\nBandit-based recommender for Pixel."

  - title: "Developer Tools"
    date: "2022"
    category: "Enterprise AI"
    description: "NLP-based bug management tools lowered fix latency and costs. LLM-based root cause analysis tools.\nLLM-based test scheduling offered a double-digit cost reduction.\nLLM-based test code generation."

  - title: "YouTube"
    date: "2020"
    category: "Recommender Systems"
    description: "Bandit algorithms for ad timing brought in the biggest CTR increase in product history.\nMultiple launches in Ads Safety and Trust & Safety contributing $300M+. Noisy labels techniques leading to a publication: <a href='https://arxiv.org/abs/2107.11413' target='_blank'>arxiv</a>"

  - title: "Google Shopping"
    date: "2018"
    category: "E-commerce"
    description: "Neural-network based recommendations - 5 launches, each with a single-digit increase to #queries, #clicks, #revenue, #interactions.\nBandit algorithms for whole-page layout optimization - a launch resulted in decrease in abandoned queries."
