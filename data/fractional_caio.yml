hero:
  title: "The Fractional CAIO"
  subtitle: "You're investing in AI. You're not shipping products that move revenue. That's what this engagement fixes."
  description: "You're investing in AI — $500k–$3M a year in engineering — and nothing is shipping that moves revenue or cuts cost. That's a fixable problem.\n\nI run **AI transformation programs** for **PE-backed SaaS and fintech companies** valued above **$1B**. The outcome: product changes that move metrics, engineering spend that returns instead of burning, and a team that can run and extend AI without me after 12 months.\n\n**The goal of every engagement is my own redundancy.** I work through your team, not over them — on your existing stack, with no vendor lock-in, no outsourcing, no AI theatre."

stats:
  - value: "1B+"
    label: "Users Reached"
  - value: "20+"
    label: "Product Launches"
  - value: "$300M+"
    label: "Revenue Generated"
  - value: ">12Y"
    label: "Applied ML Experience"

value_prop:
  title: "Why partner up?"
  items:
    - title: "Technical depth"
      description: "27,000 hours of expertise (recommenders, NLP, CV, RL). That means I engage credibly from CEO conversation to VLLM config — without a team of consultants behind me."
    - title: "The trifecta no other advisor has"
      description: "Top AI lab background (DeepMind) + shipped to billions + full altitude range from board strategy to engineering detail. Each attribute exists individually in other advisors. The combination doesn't."
    - title: "Organizational fluency"
      description: "Most AI failures aren't technical — they're organizational. Getting real information out of teams that communicate indirectly, building trust in hierarchical structures, getting honest assessments from people who won't say it straight: these are learned skills. They change the quality of the diagnosis."

pain_points:
  subtitle: "AI failures aren't unique. They're often predictable and preventable."
  title: "You're spending on AI. Nothing is shipping."
  quotes:
    - "The AI people often felt frustrated because the product team didn't know what AI could achieve, and the ML engineers didn't always understand the product needs."
    - "What we were really missing was someone with experience in building and leading an AI team."

what_you_get:
  title: "What you get"
  items:
    - title: "Revenue and cost that move"
      description: "AI products ship and change metrics — conversion, ARPU, retention, support deflection. Not experiments that sit in staging."
    - title: "Engineering spend that returns"
      description: "$500k–$3M/year in AI engineering stops burning on misdirected bets. Direction is validated before the sprint starts."
    - title: "A team that runs it without me"
      description: "By month twelve, your team can run and extend AI without external dependency — a higher exit multiple for the fund, and no ongoing consulting cost."

comparison:
  title: "Strategy firms leave after the deck. Software houses build it and own the dependency. I stay through the change — until your team can run it without me."
  rows:
    - attribute: "What you get"
      caio: "Shipped product, trained team, capability that persists"
      big_firms: "Slide deck and a plan"
      software_house: "Built product — ongoing dependency"
      full_hire: "A person who needs direction you don't yet have"
    - attribute: "After engagement"
      caio: "Your team runs it without me"
      big_firms: "You have a roadmap"
      software_house: "You have a product you can't extend"
      full_hire: "6–12 months to get up to speed"
    - attribute: "Talent development"
      caio: "Core focus — build and coach your AI team"
      big_firms: "Rare"
      software_house: "None — they own the capability"
      full_hire: "Self-directed — needs leadership"
    - attribute: "Vendor dependency"
      caio: "None — works on your existing stack"
      big_firms: "May push proprietary tools"
      software_house: "High — architecture tied to their team"
      full_hire: "None"

testimonials_inline:
  - text: "Jack brought a structured approach to prioritizing AI projects. His energy, clarity, and directness helped us shift focus to higher-impact areas, make better use of existing resources, and adopt a hypothesis-driven process."
    role: "CSO, Japanese fintech"
  - text: "Jack's consulting helped us understand how the portfolio company approached AI — how it's built, how it operates, and where they need to adjust. His ability to explain complex ideas and influence the team made a real difference."
    role: "Founder and Managing Partner, NYC-based investment fund"
