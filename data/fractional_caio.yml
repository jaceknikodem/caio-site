hero:
  title: "The Fractional CAIO"
  subtitle: "You're investing in AI. You're not shipping products that move revenue. That's what this engagement fixes."
  description: "You're investing over $1M in AI — and nothing is shipping that moves revenue or cuts cost. That's a fixable problem.\n\nFrom DeepMind to shipping to a billion users to board-level advisory — the combination doesn't exist anywhere else.\n\nI run **AI transformation programs** for **PE-backed SaaS and fintech companies** valued above **$1B**. The outcome: product changes that move metrics, engineering spend that returns instead of burning, and a team that can run and extend AI without me after 12 months.\n\n**The goal of every engagement is my own redundancy.** I work through your team, not over them — on your existing stack, with no vendor lock-in, no outsourcing, no AI theatre."

stats:
  - value: "1B+"
    label: "Users Reached"
  - value: "20+"
    label: "Product Launches"
  - value: "$300M+"
    label: "Revenue Generated"
  - value: "27k hrs"
    label: "Applied ML expertise"

value_prop:
  title: "What makes this different"
  items:
    - title: "I redirect the work when I see a better use of it"
      description: "Most consultants execute the brief they're given. When I see a higher-leverage opportunity — even if it means redirecting away from the original scope — I name it and move there. That judgment is the service."
    - title: "Vertically integrated across the org"
      description: "CEO (AI investment confidence, product direction) → CTO (coaching the AI leader) → Engineers (technical depth). In the same week. Most advisors stay at one altitude. The value here compounds across all three."
    - title: "I surface what the org can't say directly"
      description: "In hierarchical organizations, the real problems rarely come up in meetings. Getting honest signal from teams that communicate indirectly — and naming what everyone knows but no one says — is a learned skill. It changes the quality of the diagnosis."
    - title: "It's actually me in every session — no junior team, no delegation"
      description: "Most firms sell partner access and deliver analyst hours. I'm in the room from kickoff through month twelve — same person, no team behind the curtain. The person who was thinking about your problem before the first call is the same person at month eleven."

pain_points:
  subtitle: "AI failures aren't unique. They're often predictable and preventable."
  title: "You're spending on AI. Nothing is shipping."
  quotes:
    - "The AI people often felt frustrated because the product team didn't know what AI could achieve, and the ML engineers didn't always understand the product needs."
    - "What we were really missing was someone with experience in building and leading an AI team."

what_you_get:
  title: "What you get"
  items:
    - title: "Revenue and cost that move"
      description: "AI products ship and change metrics — conversion, ARPU, retention, support deflection. Not experiments that sit in staging."
    - title: "Engineering spend that returns"
      description: "Over $1M/year in AI engineering stops burning on misdirected bets. Direction is validated before the sprint starts."
    - title: "A team that runs it without me"
      description: "By month twelve, your team can run and extend AI without external dependency — a higher exit multiple for the fund, and no ongoing consulting cost."

comparison:
  title: "Strategy firms leave after the deck. Software houses build it and own the dependency. I stay through the change — until your team can run it without me."
  rows:
    - attribute: "What you get"
      caio: "Shipped product, trained team, capability that persists"
      big_firms: "Slide deck and a plan"
      ai_boutique: "Diagnosis and roadmap — no delivery or embedded follow-through"
      software_house: "Built product — ongoing dependency"
      full_hire: "A person who needs direction you don't yet have"
      self_build: "Whatever your team can figure out — no external benchmark on what good looks like"
    - attribute: "After engagement"
      caio: "Your team runs it without me"
      big_firms: "You have a roadmap"
      ai_boutique: "You have a plan. Execution is yours."
      software_house: "You have a product you can't extend"
      full_hire: "6–12 months to get up to speed"
      self_build: "You own it — and all the direction risk that came with it"
    - attribute: "Talent development"
      caio: "Core focus — build and coach your AI team"
      big_firms: "Rare"
      ai_boutique: "None — advisory model only"
      software_house: "None — they own the capability"
      full_hire: "Self-directed — needs leadership"
      self_build: "Grows slowly — no external coaching or pattern-matching from other engagements"
    - attribute: "Vendor dependency"
      caio: "None — works on your existing stack"
      big_firms: "May push proprietary tools"
      ai_boutique: "None"
      software_house: "High — architecture tied to their team"
      full_hire: "None"
      self_build: "None"

not_a_fit:
  title: "Not the right fit"
  intro: "I take on 2-3 engagements per year. Being direct about fit saves both sides time."
  items:
    - "Pre-Series B — the engagement fee won't make sense relative to your capital. Hire a fractional ML lead, or come back after the raise."
    - "You want to outsource AI delivery — I build your team's capability, not the product for you."
    - "You're still exploring whether AI matters for your business, not yet committed to changing how your team works."
    - "You want to hire an ML engineer — I can help you think through the role, but I'm not the hire."

testimonials_inline:
  - text: "Jack brought a structured approach to prioritizing AI projects. His energy, clarity, and directness helped us shift focus to higher-impact areas, make better use of existing resources, and adopt a hypothesis-driven process."
    role: "CSO, Japanese fintech"
  - text: "Jack's consulting helped us understand how the portfolio company approached AI — how it's built, how it operates, and where they need to adjust. His ability to explain complex ideas and influence the team made a real difference."
    role: "Founder and Managing Partner, NYC-based investment fund"
