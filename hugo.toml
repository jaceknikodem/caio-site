baseURL = 'https://jacknikodem.com/'
languageCode = 'en-us'
title = 'Jack Nikodem'
theme = 'ananke'
canonifyURLs = true

[[menus.main]]
name = 'Services'
url = '/the-fractional-caio/'
weight = 1

[[menus.main]]
name = 'Case Studies'
url = '/case-studies/'
weight = 2

[[menus.main]]
name = 'Writing'
url = '/writing/'
weight = 3

[[menus.main]]
name = 'About'
url = '/about_me/'
weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  minifyOutput = true
  disableXML = false
  disableHTML = false
  disableCSS = false
  disableJS = false
  disableJSON = false
  disableSVG = false


[build]
  useResourceCache = true
  checkWatchedFiles = true
