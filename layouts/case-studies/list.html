{{ define "header" }}
{{ partial "page-header.html" . }}
{{ end }}

{{ define "main" }}
<style>
    .cs-list-wrapper {
        max-width: var(--site-max-width);
        margin: 0 auto;
        padding: 3rem 1.5rem;
    }

    .cs-list-intro {
        max-width: 640px;
        margin-bottom: 3rem;
    }

    .cs-list-intro h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.02em;
        color: var(--default-text);
    }

    .cs-list-intro p {
        font-size: 1.1rem;
        color: var(--default-gray);
        line-height: 1.6;
        margin: 0;
    }

    .cs-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    @media (min-width: 640px) {
        .cs-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 1000px) {
        .cs-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    .cs-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 16px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        text-decoration: none;
        color: inherit;
    }

    .cs-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        border-color: var(--default-green);
        text-decoration: none;
        color: inherit;
    }

    .cs-industry {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--default-green);
        border: 1px solid var(--default-green);
        border-radius: 50px;
        padding: 0.2rem 0.75rem;
        width: fit-content;
    }

    .cs-card-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        font-weight: 700;
        line-height: 1.3;
        color: var(--default-text);
        margin: 0;
    }

    .cs-impact {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--default-green);
        line-height: 1.1;
        letter-spacing: -0.02em;
    }

    .cs-summary {
        font-size: 0.95rem;
        color: var(--default-gray);
        line-height: 1.6;
        flex-grow: 1;
        margin: 0;
    }

    .cs-read-more {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--default-text);
        margin-top: auto;
    }

    .cs-card:hover .cs-read-more {
        color: var(--default-green);
    }
</style>

<div class="cs-list-wrapper">
    <div class="cs-list-intro">
        <h1>{{ .Title }}</h1>
        <p>{{ .Description }}</p>
    </div>

    <div class="cs-grid">
        {{ range .Pages.ByParam "weight" }}
        <a href="{{ .RelPermalink }}" class="cs-card">
            <span class="cs-industry">{{ .Params.industry }}</span>
            <h2 class="cs-card-title">{{ .Title }}</h2>
            <div class="cs-impact">{{ .Params.impact }}</div>
            <p class="cs-summary">{{ .Params.summary }}</p>
            <span class="cs-read-more">Read case study &rarr;</span>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
